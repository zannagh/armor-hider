[[mods]]
modId="armor_hider"
version="${version}"
displayName="Armor Hider"
description="Small mod to hide armor pieces based on player preferences."
authors="zannagh"
logoFile="assets/armor-hider/icon.png"

[[mixins]]
config="armor-hider.mixins.json"

[[mixins]]
config="armor-hider.client.mixins.json"

[[dependencies."armor_hider"]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."armor_hider"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version}"
ordering="NONE"
side="BOTH"

# eunomia supplies the config/networking framework armor-hider compiles against (eunomia-core) and
# installs the live client/server transports at runtime. Ordered AFTER so eunomia's init runs first.
# Published on CurseForge (project 1654849) and Modrinth (project BvzQw4wL, approved 2026-09-16). Floor is 0.3.4: armor-hider's per-player
# config rides eunomia 0.3.0's replicated keyed store (ReplicatedPlayerConfig / ReplicatedPlayerConfigStore
# / ReplicatedClientStore) and the HTTP/WebSocket external-relay fallback (ClientTransportSelector /
# ExternalServerClient), and 0.3.2's versioned API surface (ApiVersion / SemanticVersion) plus the reworked
# relay protocol (RelayProtocol / RelayEndpoints / RelayConnectionState) and send-gate fallback - on top of
# the earlier send gate (0.2.3) and installDefaultGson (0.2.4). 0.3.4 is the floor rather than a preference
# because it moves the send gate's per-connection reset out of the HELLO probe and into the connection
# lifecycle (CommunicationManager.beginClientConnection): before it, armor-hider's join-time PLAYER_CONFIG
# send - parked behind the gate by the default AFTER_SUCCESSFUL_HANDSHAKE - was discarded by the probe's own
# reset whenever armor-hider's join listener happened to be registered ahead of eunomia's, which no
# initializer ordering on our side could make safe.
# 0.3.10 is a floor for a different reason than 0.3.9 was: not a missing method, but a missing FIX. Before
# it, a client whose armor-hider is newer than the server's decoded the old wire format, threw out of the
# StreamCodec and was disconnected by Netty (and the serverbound path had the same hole, so any client could
# drop a connection). 0.3.10 drops an undecodable payload instead of throwing. Pairing this mod with 0.3.9
# would compile and load, then kick players on a version-mismatched server - so the floor has to say 0.3.10.
#
# The floor moved 0.3.4 -> 0.3.9 when the Cloud Synchronisation row started calling API that simply does
# not exist earlier: EunomiaSyncSettings.isLockedByServer(SyncSetting) (admin-enforced sync, so the row
# can grey itself) and EunomiaClientConfiguration.syncUnavailableNotice(...) (armor-hider's own wording
# on eunomia's "this server has no eunomia" toast). Both landed in 0.3.9. Against an older eunomia these
# are a NoSuchMethodError at render time, not a graceful degradation, so the floor has to say 0.3.9.
#
# 0.3.11 is a floor for the same kind of reason as 0.3.10: a missing FIX, not a missing method.
# Before it, eunomia raised its server-side join event from the login listener and then polled the
# player list for ~4.3 s waiting for the player to appear. From 1.20.5 on the player only lands there
# after the whole configuration phase - registry sync, resource-pack download, and PrepareSpawnTask's
# chunk load on 26.x - which is client-driven and unbounded, so on a busy or heavily modded server the
# poll simply loses and every eunomia join handler is skipped. One of those handlers is
# ReplicatedStores.pushAllTo, which is exactly how armor-hider's per-player config
# (AhReplicatedPlayerConfig implements eunomia's ReplicatedPlayerConfig) reaches a joining player.
# Against 0.3.10 this mod loads and compiles fine, then silently fails to replicate anyone's config to
# newcomers on precisely the servers that hit it - so the floor has to say 0.3.11. See #375.
#
# 0.3.12 is a hard floor on NeoForge specifically, and not for a subtle reason: below it, eunomia had
# no working transport on this loader AT ALL. Its codec-injection mixin targets the vanilla two-arg
# CustomPacketPayload.codec(FallbackProvider, List), which NeoForge patches to four args, so the
# injection matched nothing and - with no injectors.defaultRequire - failed silently. No codecs meant
# the client's eunomia:hello never reached the wire, the server's send gate never resolved, and every
# clientbound packet this mod pushes on join was dropped 15 s later. That is the whole of armor-hider's
# networking on NeoForge, so pairing this build with an older eunomia there is not degraded, it is dead.
#
# It matters on Fabric too, for the opposite reason: since AhPackets.registerAll() now declares every
# channel up front, running against an eunomia that lacks the matching send guard would hand unwired
# channels to the encoder, and NeoForge turns that into an EncoderException on the netty thread that
# drops the connection. Loud breakage rather than quiet - still breakage. See armor-hider #375.
[[dependencies."armor_hider"]]
modId="eunomia"
type="required"
versionRange="[0.3.12,)"
ordering="AFTER"
side="BOTH"

[[dependencies."armor_hider"]]
modId="luckperms"
type="optional"
versionRange="[5.4,)"
ordering="AFTER"
side="SERVER"

# Optional: armor-hider still loads when EMF is absent, but refuses to load against EMF older
# than 3.3, whose render API this build hard-links (EmfForcedVanillaResolver). Client-side only.
[[dependencies."armor_hider"]]
modId="entity_model_features"
type="optional"
versionRange="[3.3,)"
ordering="NONE"
side="CLIENT"
