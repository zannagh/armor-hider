modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="armor_hider"
version="${version}"
displayName="Armor Hider"
description="Small mod to hide armor pieces based on player preferences."
authors="zannagh"
logoFile="assets/armor-hider/icon.png"

[[mixins]]
config="armor-hider.mixins.json"

[[mixins]]
config="armor-hider.client.mixins.json"

[[dependencies."armor_hider"]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."armor_hider"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version}"
ordering="NONE"
side="BOTH"

# eunomia supplies the config/networking framework armor-hider compiles against (eunomia-core) and
# installs the live client/server transports at runtime. Ordered AFTER so eunomia's init runs first.
# Published on CurseForge (project 1654849) and Modrinth (project BvzQw4wL, approved 2026-09-16). Floor is 0.3.4: armor-hider's per-player
# config rides eunomia 0.3.0's replicated keyed store (ReplicatedPlayerConfig / ReplicatedPlayerConfigStore
# / ReplicatedClientStore) and the HTTP/WebSocket external-relay fallback (ClientTransportSelector /
# ExternalServerClient), and 0.3.2's versioned API surface (ApiVersion / SemanticVersion) plus the reworked
# relay protocol (RelayProtocol / RelayEndpoints / RelayConnectionState) and send-gate fallback - on top of
# the earlier send gate (0.2.3) and installDefaultGson (0.2.4). 0.3.4 is the floor rather than a preference
# because it moves the send gate's per-connection reset out of the HELLO probe and into the connection
# lifecycle (CommunicationManager.beginClientConnection): before it, armor-hider's join-time PLAYER_CONFIG
# send - parked behind the gate by the default AFTER_SUCCESSFUL_HANDSHAKE - was discarded by the probe's own
# reset whenever armor-hider's join listener happened to be registered ahead of eunomia's, which no
# initializer ordering on our side could make safe.
# The floor moved 0.3.4 -> 0.3.9 when the Cloud Synchronisation row started calling API that simply does
# not exist earlier: EunomiaSyncSettings.isLockedByServer(SyncSetting) (admin-enforced sync, so the row
# can grey itself) and EunomiaClientConfiguration.syncUnavailableNotice(...) (armor-hider's own wording
# on eunomia's "this server has no eunomia" toast). Both landed in 0.3.9. Against an older eunomia these
# are a NoSuchMethodError at render time, not a graceful degradation, so the floor has to say 0.3.9.
[[dependencies."armor_hider"]]
modId="eunomia"
type="required"
versionRange="[0.3.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies."armor_hider"]]
modId="luckperms"
type="optional"
versionRange="[5.4,)"
ordering="AFTER"
side="SERVER"

# Optional: armor-hider still loads when EMF is absent, but refuses to load against EMF older
# than 3.3, whose render API this build hard-links (EmfForcedVanillaResolver). Client-side only.
[[dependencies."armor_hider"]]
modId="entity_model_features"
type="optional"
versionRange="[3.3,)"
ordering="NONE"
side="CLIENT"
