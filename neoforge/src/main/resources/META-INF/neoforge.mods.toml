modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="armor_hider"
version="${version}"
displayName="Armor Hider"
description="Small mod to hide armor pieces based on player preferences."
authors="zannagh"
logoFile="assets/armor-hider/icon.png"

[[mixins]]
config="armor-hider.mixins.json"

[[mixins]]
config="armor-hider.client.mixins.json"

[[dependencies."armor_hider"]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."armor_hider"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version}"
ordering="NONE"
side="BOTH"

# eunomia supplies the config/networking framework armor-hider compiles against (eunomia-core) and
# installs the live client/server transports at runtime. Ordered AFTER so eunomia's init runs first.
# Published on CurseForge (project 1654849; Modrinth pending). Floor is 0.2.5: armor-hider relies on
# eunomia's built-in send gate (0.2.3), the Gson-init-race fix (0.2.4's installDefaultGson), and 0.2.5's
# stable 26.2 / 26.3-snap.8 builds.
[[dependencies."armor_hider"]]
modId="eunomia"
type="required"
versionRange="[0.2.5,)"
ordering="AFTER"
side="BOTH"

[[dependencies."armor_hider"]]
modId="luckperms"
type="optional"
versionRange="[5.4,)"
ordering="AFTER"
side="SERVER"
