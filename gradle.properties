org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false

loom.shareRemapCaches=true

# eunomia library version, consumed by the mod (compileOnly, via stonecutter.properties.toml too),
# the :paper plugin (shaded), and the :smoke harness. Kept here so the non-stonecutter siblings see it.
eunomia.version=0.2.5

# JaCoCo tooling version. Pinned (not the Gradle-bundled default) because 26.x variants compile to Java 25
# bytecode (class file major 69), which only JaCoCo >= 0.8.14 can read. Used by every jacoco report task
# and by the offline instrumentation in the E2E coverage path.
jacoco.version=0.8.14
