# 26.3 release pins (2026-09-16). Mods without a 26.3-series build keep their 26.2 hash so they can be
# bumped in one place when a 26.3 build ships - but that jar is NOT loaded on 26.3: FetchCompatJars
# skips any pin whose game_versions omit the row's MC version when no 26.3 build can be auto-resolved
# (observed for waveycapes, elytratrims and the modmenu 26.3-rc-1 pin). Until those mods publish 26.3
# builds, their compat paths are not exercised by the 26.3 smoke rows.
