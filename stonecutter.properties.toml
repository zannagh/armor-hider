# Global properties
maven_group = "de.zannagh.armorhider"
archives_base_name = "armor-hider"
# 0.19.5+: Fabric Language Kotlin 1.14.1 (transitive dep of ElytraTrims, auto-resolved for the smoke
# matrix) declares fabricloader >=0.19.5, and Female Gender Mod 5.0.0-Beta.5 does too. The dev/test
# loader pin does not change the published mod's loader floor (see fabricloader_min in multiloader-loom).
loader_version = "0.19.5"
# eunomia-core compile-time API version. Version-agnostic (no MC suffix), so one value covers every
# variant. Consumed compileOnly; the eunomia mod supplies the runtime. Matches eunomia's release tag.
eunomia.version = "0.3.4"
# eunomia mod jar on CurseForge (project id; Modrinth pending approval). The per-MC fabric file id is
# pinned per fabric variant below as `eunomia.cf.file`. The FCGT smoke run resolves that file via the
# keyless Cursemaven proxy (`curse.maven:eunomia-<project>:<file>`) and drops it into run/mods as
# armor-hider's required runtime dependency. Update the file ids on each eunomia release.
eunomia.cf.project = "1654849"

