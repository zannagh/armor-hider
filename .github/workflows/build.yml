# Build validation for pull requests.
# Ensures the project compiles and tests pass.

name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel in-progress runs for the same PR
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-runner:
    name: Determine Runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick a runner
        id: pick
        uses: zannagh/versionizer/determine-runner@v1
        with:
          # Fine-grained PAT with Administration:read on this repo (lists runners). Missing/invalid
          # token degrades gracefully to default-runs-on.
          runner-token: ${{ secrets.RUNNER_TOKEN }}
          required-labels: 'Linux,X64,build'
          default-runs-on: 'ubuntu-latest'

  build:
    name: Build & Test
    needs: determine-runner
    runs-on: ${{ fromJSON(needs.determine-runner.outputs.runner) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1

      - name: Calculate Version
        id: version
        uses: zannagh/versionizer/calculate-version@v1

      # `stageArtifacts` below compiles everything but runs NO tests, so without this step the job
      # only ever checked that the project builds. Runs first, to fail fast.
      #
      # Deliberately NOT `./gradlew test`: :smoke:test arms itself when the requested task names
      # contain exactly "test" (smoke/build.gradle.kts), which would boot real Minecraft clients and
      # PaperMC servers on every pull request. Naming the two unit-test tasks explicitly keeps this
      # to a few seconds and cannot pull in the smoke matrix.
      #
      # The common tests are stonecutter-versioned and only enabled on the active variant
      # (`enabled = sc.current.isActive`), so the variant is read from the controller rather than
      # hardcoded - otherwise this silently becomes a no-op the next time the active variant moves.
      - name: Unit tests
        run: |
          ACTIVE=$(grep -oE 'stonecutter active "[^"]+"' stonecutter.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$ACTIVE" ]; then
            echo "::error::Could not read the active stonecutter variant from stonecutter.gradle.kts"
            exit 1
          fi
          echo "Active stonecutter variant: $ACTIVE"
          # Braces are load-bearing: unbraced, `$ACTIVE:test` is parsed by zsh as the `:t` (tail)
          # parameter modifier, yielding `:common:fabric-26.2est`. Harmless in CI's bash, but it
          # breaks the moment anyone runs this line in a local zsh shell.
          ./gradlew :paper:test ":common:${ACTIVE}:test"

      - name: Build & Stage Artifacts
        run: ./gradlew stageArtifacts -PsemVer="${{ steps.version.outputs.fullSemVer }}" -Pprerelease="true"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: armor-hider-${{ steps.version.outputs.fullSemVer }}
          path: staging/*.jar
          if-no-files-found: warn
