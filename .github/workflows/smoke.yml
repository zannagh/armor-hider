# Headless smoke gate for PRs into main, plus a nightly full matrix and E2E-coverage job.
#
# These tests boot a REAL Minecraft client (FCGT) under Xvfb + Mesa llvmpipe software GL. The smoke jobs are
# skipped unless configured; the required `smoke-result` check then still passes. When smoke runs,
# `smoke-result` fails iff the smoke job failed - a real merge gate.
#
# Budget: the PR gate runs the full FCGT scenario batch on fabric-26.2 in BOTH compat modes (~3m50) plus a
# parallel boot-breadth sweep of the other current versions (~1m30) - comfortably under the 7-minute cap.
# The exhaustive loader/version matrix and the E2E-coverage upload run nightly (or via workflow_dispatch),
# not on every PR.
name: Smoke (headless)

on:
  # No paths-ignore: smoke-result is meant to be a REQUIRED status check, and a workflow skipped by
  # paths-ignore never reports its checks - a docs-only PR would then wait forever on a missing required
  # check. Trigger on every PR to main; the skip path keeps it cheap.
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  # Gradle resolves eunomia-core/eunomia-common from GitHub Packages; reading them needs an
  # authenticated token (exported as GITHUB_TOKEN on each Gradle job below).
  packages: read

# Headless software-GL environment for booting real clients on the runner.
env:
  LIBGL_ALWAYS_SOFTWARE: "1"
  MESA_GL_VERSION_OVERRIDE: "4.5"
  # eunomia-core/eunomia-common live in GitHub Packages (maven.pkg.github.com/zannagh/eunomia) and
  # need an authenticated read. buildSrc only declares that repository when a token is visible, and
  # :paper fails at configuration time without one, so every ./gradlew invocation here needs it.
  # EUNOMIA_PACKAGES_TOKEN is deliberately NOT defined: eunomia is a public repo publishing a public
  # package, so the automatic token can read it. It is an escape hatch if that package ever goes
  # private (a PAT with read:packages); unset, it evaluates empty and the automatic token is used.
  GITHUB_TOKEN: ${{ secrets.EUNOMIA_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PR gate itself. Skipped unless configured.
  smoke:
    name: PR smoke gate (fabric-26.2)
    if: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.RUNS_ON || '{}').smoke }}
    runs-on: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.RUNS_ON || '{}').smoke || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1

      # Full FCGT scenario batch on the active version, bare (compat=none) AND full-stack (compat=all).
      # One launch per compat set; each runs entity-render + individual-config + keybind + combat +
      # water/glint/gender/elytra + emf-fa. emf-fa self-skips its EMF-custom-model assertions under
      # software GL (capability probe), so it never falsely reds here.
      - name: Core scenarios (fabric-26.2, both compat)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew :smoke:smokeTest --tests 'de.zannagh.armorhider.smoke.SmokeMatrixTest' \
              -Dsmoke.only=fabric-26.2 -Dsmoke.phase=entity-render \
              --build-cache --no-daemon --console=plain

      # Cross-version / cross-loader boot breadth. compat=none (the full compat stack is Fabric-only), run
      # across variants in parallel so the wall-clock is one wave, not a sum.
      #
      # neoforge-26.2 is deliberately EXCLUDED: NeoForge 26.2.0.32-beta crashes in its own CommonModLoader
      # init with `NoSuchFieldError: NeoForgeMod.NAMETAG_DISTANCE` (a field the beta renamed) - a NeoForge
      # bug, not ours (the mod never references it, and it fails identically on main). The nightly full
      # matrix still attempts it; re-add here once a NeoForge 26.2 build that boots cleanly is pinned.
      - name: Boot breadth (current versions)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew :smoke:smokeTest --tests 'de.zannagh.armorhider.smoke.SmokeMatrixTest' \
              -Dsmoke.phase=boot \
              -Dsmoke.only=fabric-1.21.11,neoforge-1.21.11 \
              -Dsmoke.compat=none -Dsmoke.parallel=4 \
              --build-cache --no-daemon --console=plain

  # Required status check. Passes when smoke succeeded OR was skipped; fails when smoke ran and did not
  # succeed. Set THIS job as the required check in branch protection, not `smoke`.
  smoke-result:
    name: Smoke gate result
    needs: [smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          echo "smoke=${{ needs.smoke.result }}"
          # Not configured (or a fork PR): smoke legitimately did not run - pass.
          if [ "${{ needs.smoke.result }}" == "skipped" ]; then
            echo "Smoke skipped. Passing gate."
            exit 0
          fi
          # Smoke ran, so it must have reached a clean success. Anything else - failure, cancelled,
          # timed_out - blocks; a cancelled/timed-out run is not a pass.
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "::error::Headless smoke did not succeed (result=${{ needs.smoke.result }}) - see the 'PR smoke gate' job."
            exit 1
          fi
          echo "Smoke passed."
          exit 0

  # Exhaustive loader/version matrix (all Fabric+NeoForge variants, Paper/Folia), parallelised. Nightly and
  # on-demand only - too broad and slow for a per-PR gate.
  full-matrix:
    name: Nightly full matrix
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.RUNS_ON || '{}').smoke-matrix }}
    runs-on: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.RUNS_ON || '{}').smoke-matrix || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1
      - name: Full smoke matrix (parallel)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew :smoke:smokeTest -Dsmoke.parallel=4 --no-daemon --console=plain

      # Dual-version EMF matrix: run the emf-fa scenario against BOTH pinned EMF versions (3.2.6 default
      # + 3.3 alt) via -Psmoke.emf.version override. Two sequential client launches, so it stays off the
      # PR gate and only runs nightly. Headless gives boot/no-crash coverage across both EMF jars; the
      # strict #217 EMF-custom-model path assertions only bite on a real GPU (emf-fa self-skips them under
      # software GL), so this guards against a hard boot regression when EMF is bumped, not pixel parity.
      - name: EMF version matrix (emf-fa, both EMF versions)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew :smoke:smokeTest --tests '*EmfVersionMatrixSmokeTest*' \
              -Dsmoke.emf.matrix=true --no-daemon --console=plain

  # E2E line coverage from an offline-instrumented FCGT run (fabric-26.2, full-stack), uploaded to Codecov
  # under the `e2e` flag so render/config/net lines exercised only in a live client are credited alongside
  # the Tier-1 unit coverage. Nightly/on-demand: instrumentation adds overhead we keep off the PR gate.
  coverage:
    name: E2E coverage (fabric-26.2)
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.RUNS_ON || '{}').smoke-coverage }}
    runs-on: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.RUNS_ON || '{}').smoke-coverage || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1
      # Single instrumented launch (all scenarios, compat=all) writes build/jacoco/e2e-client.exec. The
      # offline JaCoCo runtime dumps on JVM shutdown regardless of exit code, so even if one scenario reds
      # the exec still holds everything up to it - hence the report/upload steps run with if: always().
      - name: Instrumented FCGT run
        run: |
          rm -rf build/jacoco
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew :fabric:fabric-26.2:runClientGametest -Psmoke -Pcompat=all -Psmoke.coverage \
              --no-daemon --console=plain
      - name: E2E JaCoCo report
        if: always()
        run: ./gradlew e2eCoverage --no-daemon --console=plain
      - name: Upload E2E coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/e2e/e2eCoverage.xml
          flags: e2e
          disable_search: true
          fail_ci_if_error: false
