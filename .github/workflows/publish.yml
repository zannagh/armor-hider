name: Build & Publish

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force create a prerelease even if only non-code files changed'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Run full pipeline without actually publishing (overrides PUBLISH_TO_MODRINTH/PUBLISH_TO_CURSEFORGE and skips GitHub release creation)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODRINTH_PROJECT_ID: 'zannaghs-armor-hider'
  CURSEFORGE_PROJECT_ID: '1475841'
  # Hangar project slug (the last path segment of hangar.papermc.io/<owner>/<slug>).
  HANGAR_PROJECT_SLUG: 'armor-hider'
  # Set to 'true' to enable actual publishing, 'false' for dry-run
  PUBLISH_TO_MODRINTH: 'true'
  PUBLISH_TO_CURSEFORGE: 'true'
  PUBLISH_TO_HANGAR: 'true'

jobs:
  check-runner:
    name: Check Runner
    uses: ./.github/workflows/check-runner.yml
    secrets: inherit

  analyze:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release-check.outputs.should_release }}
      is_manual_release: ${{ steps.release-check.outputs.is_manual_release }}
      skip_reason: ${{ steps.release-check.outputs.skip_reason }}
      semver: ${{ steps.version.outputs.majorMinorPatch }}
      prerelease_number: ${{ steps.version.outputs.preReleaseNumber }}
      full_semver: ${{ steps.version.outputs.fullSemVer }}
      commits_since: ${{ steps.version.outputs.commitsSinceVersionSource }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        uses: zannagh/versionizer/calculate-version@v1

      - name: Debug Version Info
        run: |
          echo "MajorMinorPatch: ${{ steps.version.outputs.majorMinorPatch }}"
          echo "PreReleaseNumber: ${{ steps.version.outputs.preReleaseNumber }}"
          echo "FullSemVer: ${{ steps.version.outputs.fullSemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.version.outputs.commitsSinceVersionSource }}"
          echo "PreReleaseLabel: ${{ steps.version.outputs.preReleaseLabel }}"
          echo "Config Source: ${{ steps.version.outputs.configSource }}"

      - name: Check Release
        id: release-check
        uses: zannagh/versionizer/check-release@v1
        with:
          event-name: ${{ github.event_name }}
          is-dry-run: ${{ inputs.dry_run }}
          force-release: ${{ inputs.force_release }}

  validate-version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    needs: analyze
    if: needs.analyze.outputs.is_manual_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "Tag version: $VERSION"

          # Exclude pre-release tags (containing '-') so that e.g. 0.7.8 is not
          # considered a downgrade from 0.7.8-pre.2 (sort -V is not SemVer-aware).
          LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -n1 | sed 's/^v//' || echo "0.0.0")
          if [[ "$LATEST" == "$VERSION" ]]; then
            LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | sed -n '2p' | sed 's/^v//' || echo "0.0.0")
          fi
          echo "Latest existing version: $LATEST"

          HIGHER=$(echo -e "$VERSION\n$LATEST" | sort -V | tail -n1)
          if [[ "$HIGHER" != "$VERSION" && "$VERSION" != "$LATEST" ]]; then
            echo "::error::Version downgrade detected! New version ($VERSION) is lower than existing version ($LATEST)"
            exit 1
          fi
          echo "Version validation passed: $VERSION >= $LATEST"

  check-modrinth:
    name: Check Modrinth Versions
    runs-on: ubuntu-latest
    needs: analyze
    if: needs.analyze.outputs.should_release == 'true'
    outputs:
      version_exists: ${{ steps.modrinth-check.outputs.version_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version to check
        id: mod-ver
        uses: zannagh/versionizer/determine-version@v1
        with:
          is-manual-release: ${{ needs.analyze.outputs.is_manual_release }}
          release-tag-name: ${{ github.event.release.tag_name }}
          release-prerelease: ${{ github.event.release.prerelease }}
          semver: ${{ needs.analyze.outputs.semver }}
          prerelease-number: ${{ needs.analyze.outputs.prerelease_number }}
          commits-since: ${{ needs.analyze.outputs.commits_since }}

      - name: Check Modrinth Version
        id: modrinth-check
        uses: ./.github/actions/check-modrinth-version
        with:
          project-id: ${{ env.MODRINTH_PROJECT_ID }}
          mod-version: ${{ steps.mod-ver.outputs.version }}

  build:
    name: Build
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner || '["ubuntu-latest"]') }}
    needs: [analyze, check-modrinth, check-runner]
    if: "!cancelled() && needs.analyze.result == 'success'"
    defaults:
      run:
        shell: bash
    outputs:
      mod_version: ${{ steps.mod-ver.outputs.version }}
      is_prerelease: ${{ steps.mod-ver.outputs.is_prerelease }}
      supported_versions: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1

      - name: Cache NeoForge NFRT Artifacts
        uses: actions/cache@v6
        with:
          path: neoforge/versions/*/build/moddev/artifacts/
          key: nfrt-${{ runner.os }}-${{ hashFiles('neoforge/versions/*/gradle.properties') }}

      - name: Determine Mod Version
        id: mod-ver
        uses: zannagh/versionizer/determine-version@v1
        with:
          is-manual-release: ${{ needs.analyze.outputs.is_manual_release }}
          release-tag-name: ${{ github.event.release.tag_name }}
          release-prerelease: ${{ github.event.release.prerelease }}
          semver: ${{ needs.analyze.outputs.semver }}
          prerelease-number: ${{ needs.analyze.outputs.prerelease_number }}
          commits-since: ${{ needs.analyze.outputs.commits_since }}

      - name: Build & Stage Artifacts
        run: |
          ./gradlew stageArtifacts \
            -PsemVer="${{ steps.mod-ver.outputs.version }}" \
            -Pprerelease="${{ steps.mod-ver.outputs.is_prerelease }}"

      - name: Read Supported Versions
        id: versions
        run: |
          # "paper" is a single version-agnostic plugin jar (display_version == "paper"),
          # so it contributes exactly one matrix entry: {minecraft: "paper", loader: "paper"}.
          MATRIX=$(jq -c '[
            (.fabric // {} | keys[] | {minecraft: ., loader: "fabric"}),
            (.neoforge // {} | keys[] | {minecraft: ., loader: "neoforge"}),
            (.paper // {} | keys[] | {minecraft: ., loader: "paper"})
          ]' staging/versions.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: armor-hider-${{ steps.mod-ver.outputs.version }}
          path: |
            staging/*.jar
            staging/versions.json
          if-no-files-found: error

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [analyze, build]
    if: needs.analyze.outputs.should_release == 'true'
    outputs:
      full: ${{ steps.full-changelog.outputs.content }}
      user-facing: ${{ steps.user-changelog.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Full Changelog
        id: full-changelog
        uses: zannagh/versionizer/generate-changelog@v1
        with:
          is-manual-release: ${{ needs.analyze.outputs.is_manual_release }}
          release-body: ${{ github.event.release.body }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          repository: ${{ github.repository }}

      - name: Generate User-Facing Changelog
        id: user-changelog
        uses: ./.github/actions/generate-user-changelog
        with:
          is-manual-release: ${{ needs.analyze.outputs.is_manual_release }}
          release-body: ${{ github.event.release.body }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          repository: ${{ github.repository }}

  # ============================================================================
  # CREATE GITHUB PRERELEASE (automatic)
  # ============================================================================
  create-prerelease:
    name: Create GitHub Prerelease
    runs-on: ubuntu-latest
    needs: [analyze, check-modrinth, build, changelog]
    if: |
      needs.analyze.outputs.should_release == 'true' &&
      needs.analyze.outputs.is_manual_release != 'true' &&
      needs.check-modrinth.outputs.version_exists != 'true'
    permissions:
      contents: write
    steps:
      - name: Create Prerelease
        uses: zannagh/versionizer/create-prerelease@v1
        with:
          version: ${{ needs.build.outputs.mod_version }}
          changelog: ${{ needs.changelog.outputs.full }}
          artifact-name: armor-hider-${{ needs.build.outputs.mod_version }}
          artifact-pattern: artifacts/**/*.jar
          dry-run: ${{ inputs.dry_run }}

  # ============================================================================
  # UPLOAD TO GITHUB RELEASE (manual releases)
  # ============================================================================
  upload-to-release:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: [analyze, build, validate-version]
    if: needs.analyze.outputs.is_manual_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*.jar

  # ============================================================================
  # PUBLISH TO MODRINTH
  # ============================================================================
  publish-modrinth:
    name: Publish to Modrinth
    runs-on: ubuntu-latest
    needs: [analyze, check-modrinth, build, changelog]
    if: |
      needs.analyze.outputs.should_release == 'true' &&
      needs.analyze.outputs.is_manual_release == 'true' &&
      needs.check-modrinth.outputs.version_exists != 'true'
    strategy:
      fail-fast: false
      # Serialize: parallel jobs hammer Modrinth's API and get rate-limited (429). mc-publish
      # resolves loaders/game-versions against Modrinth's tag endpoints, and a throttled fetch
      # silently yields empty metadata - the version publishes with no loaders/game_versions.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.build.outputs.supported_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: armor-hider-${{ needs.build.outputs.mod_version }}
          path: artifacts

      - name: Get game versions
        id: game-versions
        run: |
          VERSIONS=$(jq -r '."${{ matrix.loader }}"."${{ matrix.minecraft }}" // ["${{ matrix.minecraft }}"] | .[]' artifacts/versions.json)
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$VERSIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare Modrinth Upload
        id: modrinth
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          display-version: ${{ matrix.minecraft }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          is-prerelease: ${{ needs.build.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Preview Modrinth Upload
        if: steps.modrinth.outputs.found == 'true'
        env:
          CHANGELOG: ${{ needs.changelog.outputs.user-facing }}
        run: |
          echo "=========================================="
          echo "MODRINTH UPLOAD PREVIEW"
          echo "=========================================="
          echo ""
          echo "File: ${{ steps.modrinth.outputs.jar_path }}"
          echo ""
          echo "Version Details:"
          echo "  Project ID:    ${{ env.MODRINTH_PROJECT_ID }}"
          echo "  Version:       ${{ steps.modrinth.outputs.version_number }}"
          echo "  Display Name:  ${{ steps.modrinth.outputs.version_name }}"
          echo "  Version Type:  ${{ steps.modrinth.outputs.version_type }}"
          echo "  Game Versions: ${{ matrix.minecraft }}"
          echo "  Loader:        ${{ matrix.loader }}${{ matrix.loader == 'fabric' && ', quilt' || '' }}${{ matrix.loader == 'paper' && ', folia, purpur, spigot, bukkit' || '' }}"
          echo ""
          echo "Changelog:"
          echo "---"
          printf '%s\n' "$CHANGELOG"
          echo "---"
          echo ""
          if [[ "${{ inputs.dry_run }}" != "false" ]]; then
            echo "DRY RUN - Skipping actual Modrinth upload"
          elif [[ "${{ env.PUBLISH_TO_MODRINTH }}" == "true" ]]; then
            echo "PUBLISH_TO_MODRINTH=true - Will publish to Modrinth"
          else
            echo "PUBLISH_TO_MODRINTH=false - Publishing disabled"
          fi
          echo "=========================================="

      - name: Publish to Modrinth
        if: ${{ steps.modrinth.outputs.found == 'true' && env.PUBLISH_TO_MODRINTH == 'true' && !inputs.dry_run }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.modrinth.outputs.jar_path }}
          name: ${{ steps.modrinth.outputs.version_name }}
          version: ${{ steps.modrinth.outputs.version_number }}
          version-type: ${{ steps.modrinth.outputs.version_type }}
          # The Paper plugin is pure Bukkit API, so it also covers the Bukkit-derived
          # server platforms Modrinth models as separate loaders.
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
            ${{ matrix.loader == 'paper' && 'folia' || '' }}
            ${{ matrix.loader == 'paper' && 'purpur' || '' }}
            ${{ matrix.loader == 'paper' && 'spigot' || '' }}
            ${{ matrix.loader == 'paper' && 'bukkit' || '' }}
          game-versions: |
            ${{ steps.game-versions.outputs.list }}
          game-version-filter: any
          changelog: ${{ needs.changelog.outputs.user-facing }}
          modrinth-featured: false
          retry-attempts: 2
          retry-delay: 10000

  # ============================================================================
  # PUBLISH TO CURSEFORGE
  # ============================================================================
  publish-curseforge:
    name: Publish to CurseForge
    runs-on: ubuntu-latest
    needs: [analyze, build, changelog]
    if: |
      needs.analyze.outputs.should_release == 'true' &&
      needs.analyze.outputs.is_manual_release == 'true'
    strategy:
      fail-fast: false
      # Serialize to avoid the same rate-limit race as Modrinth (see publish-modrinth above).
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.build.outputs.supported_versions) }}
    steps:
      # CurseForge files Bukkit/Paper plugins under a separate game section that is not
      # reachable from this (Minecraft mod) project, so the Paper artifact is skipped
      # here rather than failing the job. Note: job-level `if:` cannot read `matrix`,
      # hence the per-step guards.
      - name: Skip Paper artifact
        if: matrix.loader == 'paper'
        run: echo "Skipping CurseForge upload for the Paper plugin (published to Hangar + Modrinth instead)."

      - name: Checkout
        if: matrix.loader != 'paper'
        uses: actions/checkout@v7

      - name: Download Artifacts
        if: matrix.loader != 'paper'
        uses: actions/download-artifact@v8
        with:
          name: armor-hider-${{ needs.build.outputs.mod_version }}
          path: artifacts

      - name: Get game versions
        if: matrix.loader != 'paper'
        id: game-versions
        run: |
          VERSIONS=$(jq -r '."${{ matrix.loader }}"."${{ matrix.minecraft }}" // ["${{ matrix.minecraft }}"] | .[]' artifacts/versions.json)
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$VERSIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare CurseForge Upload
        if: matrix.loader != 'paper'
        id: curseforge
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          display-version: ${{ matrix.minecraft }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          is-prerelease: ${{ needs.build.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Preview CurseForge Upload
        if: matrix.loader != 'paper' && steps.curseforge.outputs.found == 'true'
        env:
          CHANGELOG: ${{ needs.changelog.outputs.user-facing }}
        run: |
          echo "=========================================="
          echo "CURSEFORGE UPLOAD PREVIEW"
          echo "=========================================="
          echo ""
          echo "File: ${{ steps.curseforge.outputs.jar_path }}"
          echo ""
          echo "Version Details:"
          echo "  Project ID:    ${{ env.CURSEFORGE_PROJECT_ID }}"
          echo "  Version:       ${{ steps.curseforge.outputs.version_number }}"
          echo "  Display Name:  ${{ steps.curseforge.outputs.version_name }}"
          echo "  Version Type:  ${{ steps.curseforge.outputs.version_type }}"
          echo "  Game Versions: ${{ matrix.minecraft }}"
          echo "  Loader:        ${{ matrix.loader }}${{ matrix.loader == 'fabric' && ', quilt' || '' }}"
          echo ""
          echo "Changelog:"
          echo "---"
          printf '%s\n' "$CHANGELOG"
          echo "---"
          echo ""
          if [[ "${{ inputs.dry_run }}" != "false" ]]; then
            echo "DRY RUN - Skipping actual CurseForge upload"
          elif [[ "${{ env.PUBLISH_TO_CURSEFORGE }}" == "true" ]]; then
            echo "PUBLISH_TO_CURSEFORGE=true - Will publish to CurseForge"
          else
            echo "PUBLISH_TO_CURSEFORGE=false - Publishing disabled"
          fi
          echo "=========================================="

      - name: Publish to CurseForge
        if: ${{ matrix.loader != 'paper' && steps.curseforge.outputs.found == 'true' && env.PUBLISH_TO_CURSEFORGE == 'true' && !inputs.dry_run }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.curseforge.outputs.jar_path }}
          name: ${{ steps.curseforge.outputs.version_name }}
          version: ${{ steps.curseforge.outputs.version_number }}
          version-type: ${{ steps.curseforge.outputs.version_type }}
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: |
            ${{ steps.game-versions.outputs.list }}
          game-version-filter: any
          changelog: ${{ needs.changelog.outputs.user-facing }}
          retry-attempts: 2
          retry-delay: 10000
          # Warn (don't fail) when CurseForge lacks a game version, e.g. brand-new
          # snapshots CF hasn't added yet. Re-publish once CF catches up.
          curseforge-fail-mode: warn

  # ============================================================================
  # PUBLISH TO HANGAR (Paper plugin only)
  # ============================================================================
  # Not matrixed: the Paper plugin is a single version-agnostic jar, so there is
  # exactly one upload. Published via the Hangar REST API with curl so this job does
  # not depend on the :paper subproject wiring in the Gradle publish plugin.
  publish-hangar:
    name: Publish to Hangar
    runs-on: ubuntu-latest
    needs: [analyze, build, changelog]
    if: |
      needs.analyze.outputs.should_release == 'true' &&
      needs.analyze.outputs.is_manual_release == 'true'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: armor-hider-${{ needs.build.outputs.mod_version }}
          path: artifacts

      - name: Locate Paper plugin jar
        id: jar
        run: |
          JAR=$(find artifacts -maxdepth 1 -name 'armor-hider-paper-*+paper.jar' ! -name '*-sources.jar' | head -n1)
          if [[ -z "$JAR" ]]; then
            echo "::warning::No Paper plugin jar found in the staged artifacts - skipping Hangar upload."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found Paper jar: $JAR"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Build Hangar version payload
        if: steps.jar.outputs.found == 'true'
        id: payload
        env:
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          CHANGELOG: ${{ needs.changelog.outputs.user-facing }}
        run: |
          set -euo pipefail

          # Hangar sits behind CloudFlare; a default curl UA can be served a challenge page.
          UA="armor-hider-release/1.0 (+https://github.com/${{ github.repository }})"

          # Hangar version strings must match ^[a-zA-Z0-9-_.+]+$ and be at most 32 chars.
          if [[ ! "$MOD_VERSION" =~ ^[a-zA-Z0-9._+-]+$ ]]; then
            echo "::error::Version '$MOD_VERSION' is not a valid Hangar version string (allowed: ^[a-zA-Z0-9-_.+]+\$)."
            exit 1
          fi
          if [[ "${#MOD_VERSION}" -gt 32 ]]; then
            echo "::error::Version '$MOD_VERSION' is ${#MOD_VERSION} characters - Hangar allows at most 32."
            exit 1
          fi

          # Game versions the plugin supports = the union recorded for the "paper"
          # display version in versions.json.
          jq -r '.paper.paper[]?' artifacts/versions.json > declared-versions.txt
          if [[ ! -s declared-versions.txt ]]; then
            echo "::error::versions.json has no .paper.paper entry - stageArtifacts did not stage the Paper jar."
            exit 1
          fi

          # Hangar rejects the WHOLE upload with a 400 if any platform version is unknown
          # to it (there is no partial acceptance), so intersect our list with the versions
          # Hangar actually advertises. Note: /api/v1/platforms does not exist - the real
          # endpoint is /api/v1/platforms/{platform}/versions, and it returns a grouped
          # array where each group's subVersions re-include the parent, while childless
          # groups have an empty subVersions but are themselves valid versions:
          #   [{"version":"26.2","subVersions":[]},
          #    {"version":"26.1","subVersions":["26.1.2","26.1.1","26.1"]}, ...]
          curl -sSf -A "$UA" https://hangar.papermc.io/api/v1/platforms/PAPER/versions \
            -o platforms.json || echo '[]' > platforms.json
          jq -r '.[] | if (.subVersions | length) > 0 then .subVersions[] else .version end' platforms.json \
            > known-versions.txt || true

          if [[ -s known-versions.txt ]]; then
            comm -12 <(sort -u declared-versions.txt) <(sort -u known-versions.txt) > final-versions.txt
            comm -23 <(sort -u declared-versions.txt) <(sort -u known-versions.txt) > dropped-versions.txt
            if [[ -s dropped-versions.txt ]]; then
              echo "::warning::Hangar does not know these versions yet, dropping them: $(paste -sd, dropped-versions.txt)"
            fi
          else
            echo "::warning::Could not read Hangar's platform version list - sending the declared versions unfiltered."
            cp declared-versions.txt final-versions.txt
          fi

          if [[ ! -s final-versions.txt ]]; then
            echo "::error::No supported versions left after filtering against Hangar's platform list."
            exit 1
          fi

          # The project defines Release / Beta / Snapshot. Prereleases here are versionizer
          # "-preview.N" builds, which Modrinth already publishes as version_type=beta - so
          # map them to Beta to keep the two portals consistent. Snapshot is left for any
          # future nightly/dev channel.
          #
          # Only channels that ALREADY exist on the Hangar project may be used: the upload
          # does not create channels, and an unknown name fails with a misleading
          # "channel.noColor" error rather than "unknown channel". Names must also match
          # ^[a-zA-Z0-9]+$ (1-15 chars) and are matched case-insensitively.
          CHANNEL="Release"
          if [[ "$IS_PRERELEASE" == "true" ]]; then CHANNEL="Beta"; fi
          if [[ ! "$CHANNEL" =~ ^[a-zA-Z0-9]{1,15}$ ]]; then
            echo "::error::Channel '$CHANNEL' is not a valid Hangar channel name (^[a-zA-Z0-9]+\$, 1-15 chars)."
            exit 1
          fi

          jq -n \
            --arg version "$MOD_VERSION" \
            --arg channel "$CHANNEL" \
            --arg description "$CHANGELOG" \
            --rawfile versions final-versions.txt \
            '{
              version: $version,
              channel: $channel,
              description: $description,
              files: [{ platforms: ["PAPER"] }],
              pluginDependencies: {},
              platformDependencies: {
                PAPER: ($versions | split("\n") | map(select(length > 0)))
              }
            }' > version-upload.json

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Payload:"
          cat version-upload.json

      - name: Preview Hangar Upload
        if: steps.jar.outputs.found == 'true'
        run: |
          echo "=========================================="
          echo "HANGAR UPLOAD PREVIEW"
          echo "=========================================="
          echo "File:          ${{ steps.jar.outputs.path }}"
          echo "Project slug:  ${{ env.HANGAR_PROJECT_SLUG }}"
          echo "Version:       ${{ needs.build.outputs.mod_version }}"
          echo "Channel:       ${{ steps.payload.outputs.channel }}"
          echo "Platform:      PAPER (Folia/Purpur inherit Paper on Hangar)"
          echo ""
          echo "Endpoint:      POST https://hangar.papermc.io/api/v1/projects/${{ env.HANGAR_PROJECT_SLUG }}/upload"
          echo "Auth:          Authorization: <bare JWT from POST /api/v1/authenticate?apiKey=...>"
          echo "Multipart:     versionUpload=@version-upload.json;type=application/json"
          echo "               files=@${{ steps.jar.outputs.path }};type=application/octet-stream"
          echo ""
          echo "Payload (version-upload.json):"
          echo "---"
          cat version-upload.json || echo "(payload not built)"
          echo "---"
          echo ""
          if [[ "${{ inputs.dry_run }}" != "false" ]]; then
            echo "DRY RUN - Skipping actual Hangar upload"
          elif [[ "${{ env.PUBLISH_TO_HANGAR }}" == "true" ]]; then
            echo "PUBLISH_TO_HANGAR=true - Will publish to Hangar"
          else
            echo "PUBLISH_TO_HANGAR=false - Publishing disabled"
          fi
          echo "=========================================="

      - name: Publish to Hangar
        if: ${{ steps.jar.outputs.found == 'true' && env.PUBLISH_TO_HANGAR == 'true' && !inputs.dry_run }}
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${HANGAR_API_TOKEN:-}" ]]; then
            echo "::error::HANGAR_API_TOKEN secret is not set."
            exit 1
          fi

          # Hangar sits behind CloudFlare; a default curl UA can be served a challenge page.
          UA="armor-hider-release/1.0 (+https://github.com/${{ github.repository }})"

          # Hangar API keys are exchanged for a JWT before any write call. Despite the
          # authenticate response reporting expiresIn ~2592000, the token is only valid for
          # about FIVE MINUTES - so authenticate in the same step immediately before the
          # upload, never in an earlier step or job, or the upload will 401.
          JWT=$(curl -sS --fail-with-body -A "$UA" -X POST \
            "https://hangar.papermc.io/api/v1/authenticate?apiKey=${HANGAR_API_TOKEN}" \
            | jq -r '.token')
          if [[ -z "$JWT" || "$JWT" == "null" ]]; then
            echo "::error::Failed to obtain a Hangar JWT - check HANGAR_API_TOKEN."
            exit 1
          fi

          # Send the BARE JWT: Hangar's auth filter strips "HangarAuth"/"Bearer"/whitespace,
          # so every header form is equivalent and a 401 here means the token is bad/expired.
          # The multipart part Content-Types are mandatory - without application/json on
          # versionUpload, Spring cannot bind the metadata part. Upload is rate limited
          # (burst 5, then 1 per 5s), so this is a single attempt with no retry loop.
          CODE=$(curl -sS -o hangar-response.json -w '%{http_code}' -X POST \
            "https://hangar.papermc.io/api/v1/projects/${HANGAR_PROJECT_SLUG}/upload" \
            -A "$UA" \
            -H "Authorization: $JWT" \
            -F "versionUpload=@version-upload.json;type=application/json" \
            -F "files=@${{ steps.jar.outputs.path }};type=application/octet-stream")

          echo "HTTP $CODE"
          cat hangar-response.json || true
          echo ""
          if [[ "$CODE" != "200" && "$CODE" != "201" && "$CODE" != "204" ]]; then
            # Hangar cannot overwrite an existing version - a re-upload always 400s.
            if [[ "$CODE" == "400" ]] && grep -qiE 'already exists|version\.new\.error\.nameAlreadyExists|duplicate' hangar-response.json; then
              echo "::error::Version ${{ needs.build.outputs.mod_version }} already exists on Hangar for project ${HANGAR_PROJECT_SLUG}. Hangar cannot overwrite versions - bump the version or delete the existing one manually."
              exit 1
            fi
            if [[ "$CODE" == "401" ]]; then
              echo "::error::Hangar rejected the JWT (401). The token is short-lived (~5 minutes) - check HANGAR_API_TOKEN is a valid, non-revoked API key."
              exit 1
            fi
            echo "::error::Hangar upload failed with HTTP $CODE"
            exit 1
          fi
          echo "Published ${{ needs.build.outputs.mod_version }} to Hangar."

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [analyze, validate-version, check-modrinth, build, changelog, create-prerelease, upload-to-release, publish-modrinth, publish-curseforge, publish-hangar]
    if: always()
    steps:
      - name: Download Artifacts
        if: inputs.dry_run == true && needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: armor-hider-${{ needs.build.outputs.mod_version }}
          path: artifacts

      - name: Generate Summary
        uses: zannagh/versionizer/workflow-summary@v1
        with:
          version: ${{ needs.build.outputs.mod_version }}
          is-prerelease: ${{ needs.build.outputs.is_prerelease }}
          semver: ${{ needs.analyze.outputs.semver }}
          full-semver: ${{ needs.analyze.outputs.full_semver }}
          prerelease-number: ${{ needs.analyze.outputs.prerelease_number }}
          commits-since: ${{ needs.analyze.outputs.commits_since }}
          should-release: ${{ needs.analyze.outputs.should_release }}
          is-manual-release: ${{ needs.analyze.outputs.is_manual_release }}
          skip-reason: ${{ needs.analyze.outputs.skip_reason }}
          changelog: ${{ needs.changelog.outputs.full }}
          job-results: |
            Analyze Changes=${{ needs.analyze.result }}
            Validate Version=${{ needs.validate-version.result }}
            Check Modrinth=${{ needs.check-modrinth.result }}
            Build=${{ needs.build.result }}
            Changelog=${{ needs.changelog.result }}
            Create Prerelease=${{ needs.create-prerelease.result }}
            Upload to Release=${{ needs.upload-to-release.result }}
            Publish to Modrinth=${{ needs.publish-modrinth.result }}
            Publish to CurseForge=${{ needs.publish-curseforge.result }}
            Publish to Hangar=${{ needs.publish-hangar.result }}
          additional-sections: |
            ### Modrinth

            - **Version Already Exists**: `${{ needs.check-modrinth.outputs.version_exists }}`
            - **Publish Enabled**: `${{ env.PUBLISH_TO_MODRINTH }}`

            ### CurseForge

            - **Publish Enabled**: `${{ env.PUBLISH_TO_CURSEFORGE }}`
            - **Note**: the Paper plugin is intentionally not published to CurseForge.

            ### Hangar

            - **Project Slug**: `${{ env.HANGAR_PROJECT_SLUG }}`
            - **Publish Enabled**: `${{ env.PUBLISH_TO_HANGAR }}`

      - name: Upload Preview
        if: inputs.dry_run == true && needs.build.result == 'success'
        run: |
          MOD_VERSION="${{ needs.build.outputs.mod_version }}"
          IS_PRERELEASE="${{ needs.build.outputs.is_prerelease }}"
          VERSION_TYPE="release"
          if [[ "$IS_PRERELEASE" == "true" ]]; then VERSION_TYPE="beta"; fi

          TOTAL=0
          {
            echo "## Upload Preview (Dry Run)"
            echo ""
            echo "The following versions **would** be published:"
            echo ""
            echo "| Loader(s) | Version Group | Game Versions | Version Name | Type | Portals |"
            echo "| --------- | ------------- | ------------- | ------------ | ---- | ------- |"

            for LOADER in fabric neoforge paper; do
              case "$LOADER" in
                fabric) LOADERS_DISPLAY="Fabric, Quilt"; PORTALS="Modrinth, CurseForge" ;;
                # No CurseForge: it files Bukkit plugins under a separate game section.
                paper)  LOADERS_DISPLAY="Paper, Folia, Purpur, Spigot, Bukkit"; PORTALS="Modrinth, Hangar" ;;
                *)      LOADERS_DISPLAY="${LOADER^}"; PORTALS="Modrinth, CurseForge" ;;
              esac
              for GROUP in $(jq -r ".${LOADER} // {} | keys[]" artifacts/versions.json); do
                GAME_VERSIONS=$(jq -r ".${LOADER}.\"${GROUP}\" // [\"${GROUP}\"] | join(\", \")" artifacts/versions.json)
                DISPLAY_LOADER="${LOADER^}"
                if [[ "$LOADER" == "paper" ]]; then
                  VERSION_NAME="[Paper] Plugin - ${MOD_VERSION}"
                else
                  VERSION_NAME="[${DISPLAY_LOADER}] ${GROUP} - ${MOD_VERSION}"
                fi
                echo "| ${LOADERS_DISPLAY} | ${GROUP} | ${GAME_VERSIONS} | ${VERSION_NAME} | ${VERSION_TYPE} | ${PORTALS} |"
                TOTAL=$((TOTAL + 1))
              done
            done

            echo ""
            echo "**Total version entries: $TOTAL** (see the Portals column - the Paper plugin skips CurseForge)"
          } >> "$GITHUB_STEP_SUMMARY"
