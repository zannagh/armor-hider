# GitVersion Configuration for Armor Hider
# All versions are built from main using stonecutter for multi-version support
# Supports automatic prerelease versioning on main branch

mode: ContinuousDeployment
tag-prefix: '[vV]?(1\.\d+\.\d+-)?'
version-in-branch-pattern: (\A(?!x)x)
no-bump-message: '(\+semver:\s?(none|skip))'
major-version-bump-message: '\+semver:\s?(breaking|major)'
minor-version-bump-message: '\+semver:\s?(feature|minor)'
patch-version-bump-message: '\+semver:\s?(fix|patch)'

# Commits that don't trigger version changes (used by workflow, not GitVersion directly)
# ci:, docs:, build: prefixes are handled in the workflow

commit-message-incrementing: MergeMessageOnly

strategies:
  - Fallback
  - ConfiguredNextVersion
  - MergeMessage
  - TaggedCommit

branches:
  main:
    mode: ContinuousDeployment
    increment: Patch
    label: pre
    track-merge-target: true
    track-merge-message: true
    prevent-increment:
      when-current-commit-tagged: true

  # Same rules as main, but always a prerelease line (label "exp") - merges here never produce a
  # release version, only a "beta" build published to Modrinth/CurseForge/Hangar (see publish.yml).
  experimental:
    mode: ContinuousDeployment
    increment: Patch
    label: exp
    is-release-branch: false
    track-merge-target: true
    track-merge-message: true
    prevent-increment:
      when-current-commit-tagged: true
    regex: ^experimental$
    source-branches:
      - main

  feature:
    mode: ContinuousDelivery
    increment: Patch
    label: '{BranchName}'
    regex: ^features?[/-]
    source-branches:
      - main

  pull-request:
    mode: ContinuousDelivery
    increment: Inherit
    label: pr
    regex: ^(pull|pr|merge)[/-]
    source-branches:
      - main
      - feature

  unknown:
    mode: ContinuousDelivery
    increment: Inherit
    label: '{BranchName}'
    regex: (?<BranchName>.+)
    source-branches:
      - main
      - feature
